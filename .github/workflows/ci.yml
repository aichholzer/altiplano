name: CI

# The single definition of "the tests". Runs on every pull request against main,
# and is called by the publish workflow via workflow_call so the release gate and
# the PR gate cannot drift apart.
on:
  pull_request:
    branches: [main]
  workflow_call:
    secrets:
      # Reusable workflows do not inherit the caller's secrets unless passed, so
      # this has to be declared for the publish workflow to hand it over. Not
      # required, because pull requests from forks cannot see repository secrets.
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in requires-python, and a current release.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}

      # --locked fails if uv.lock is stale rather than silently re-resolving.
      - name: Install dependencies
        run: uv sync --locked

      # The coverage flags and the 90 percent floor live in pyproject.toml, so a
      # local run enforces the same gate. Only the XML report is added here,
      # because it exists solely to be uploaded and would be litter locally.
      - name: Run tests
        run: uv run --no-sync pytest -q --cov-report=xml

      # Uploaded from one leg only. Both produce identical coverage, so a second
      # upload would add nothing but noise.
      #
      # Nothing here gates. Coverage is reported into the pull request as a
      # comment and as inline annotations on uncovered lines, and codecov.yml
      # marks the statuses informational so they cannot turn a pull request red.
      # The gate is `--cov-fail-under` in pyproject.toml, which fails the run
      # above before this step is reached.
      #
      # fail_ci_if_error stays off for the same reason, plus one more: fork pull
      # requests have no access to repository secrets, so a missing token must
      # not turn an outside contribution red.
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: aichholzer/altiplano
          files: coverage.xml
          fail_ci_if_error: false
