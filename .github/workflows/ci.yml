name: CI

on:
  pull_request:
    branches: [main]
  # Every commit that lands on main uploads coverage, and Codecov has a base to
  # compare the next pull request against. Without this, a merge commit gets no
  # run, and Codecov falls back to whichever older commit it still holds a report
  # for.
  push:
    branches: [main]
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"

      - name: Ruff
        run: uvx ruff@0.16.4 check src tests scripts

  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --no-sync pytest -q --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: aichholzer/altiplano
          files: coverage.xml
          fail_ci_if_error: false

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No ALPINE_VERSION argument. Compose builds with the Dockerfile's default,
      # `latest`, and this is the image a deploy would build today.
      - name: Build
        run: docker build --tag altiplano:ci .

      - name: Check the version and both entry points
        run: |
          expected=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          actual=$(docker run --rm --entrypoint python3 altiplano:ci -c 'import altiplano; print(altiplano.__version__)')
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::the image reports $actual and pyproject.toml says $expected"
            exit 1
          fi
          docker run --rm --entrypoint altiplano-http altiplano:ci --version
          docker run --rm --entrypoint altiplano-clientkey altiplano:ci --version

      # A loopback bind starts with an empty client store. VIKUNJA_URL has to parse,
      # and nothing connects to it. The image's healthcheck waits 30 seconds before
      # its first probe; two seconds is enough here.
      - name: Start the server and wait for the healthcheck
        run: |
          docker run --detach --name altiplano-ci \
            --env ALTIPLANO_HTTP_HOST=127.0.0.1 \
            --env VIKUNJA_URL=https://vikunja.invalid/api/v2 \
            --health-interval=2s \
            altiplano:ci
          for _ in $(seq 30); do
            state=$(docker inspect --format '{{.State.Status}} {{.State.Health.Status}}' altiplano-ci)
            echo "$state"
            case "$state" in
              "running healthy") exit 0 ;;
              exited*|dead*|*unhealthy) echo "::error::the container reported $state"; exit 1 ;;
            esac
            sleep 2
          done
          echo "::error::the container was not healthy after 60 seconds"
          exit 1

      # The healthcheck is a TCP connect. A request with no token reaching the gate
      # and coming back 401 shows the application itself answers.
      - name: Expect a 401 without a token
        run: |
          docker exec altiplano-ci python3 -c '
          import urllib.error, urllib.request
          request = urllib.request.Request("http://127.0.0.1:8000/mcp", data=b"{}", method="POST")
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as err:
              raise SystemExit(0 if err.code == 401 else f"expected 401, got {err.code}")
          raise SystemExit("expected 401, got a success")
          '

      - name: Server log
        if: always()
        run: docker logs altiplano-ci || true
