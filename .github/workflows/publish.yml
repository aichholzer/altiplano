name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    name: build and publish
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"

      - name: Refuse to republish an existing version
        run: |
          PKG_VERSION="$(uv version --short)"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          if curl -sSfI "https://pypi.org/pypi/altiplano/${PKG_VERSION}/json" > /dev/null 2>&1; then
            echo "::error::altiplano ${PKG_VERSION} is already on PyPI. Bump the version first."
            exit 1
          fi
          echo "altiplano ${PKG_VERSION} is not on PyPI yet, proceeding."

      - name: Build
        run: uv build --no-sources

      - name: Verify the built wheel imports
        run: |
          uv run --no-project --with "./dist/altiplano-${PKG_VERSION}-py3-none-any.whl" \
            python -c "import altiplano; import altiplano.server; print('wheel ok:', altiplano.__version__)"

      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish \
            "dist/altiplano-${PKG_VERSION}.tar.gz" \
            "dist/altiplano-${PKG_VERSION}-py3-none-any.whl"
