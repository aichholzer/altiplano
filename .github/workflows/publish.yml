name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    name: build and publish
    runs-on: ubuntu-latest
    needs: test

    # The workflow token is read-only, so creating the release and its tag needs
    # the grant here. This job is the only one that writes through the API, and
    # contents is the narrowest scope covering a release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"

      - name: Refuse to republish an existing version
        run: |
          PKG_VERSION="$(uv version --short)"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          if curl -sSfI "https://pypi.org/pypi/altiplano/${PKG_VERSION}/json" > /dev/null 2>&1; then
            echo "::error::altiplano ${PKG_VERSION} is already on PyPI. Bump the version first."
            exit 1
          fi
          echo "altiplano ${PKG_VERSION} is not on PyPI yet, proceeding."

      - name: Build
        run: uv build --no-sources

      - name: Verify the built wheel imports
        run: |
          uv run --no-project --with "./dist/altiplano-${PKG_VERSION}-py3-none-any.whl" \
            python -c "import altiplano; import altiplano.server; print('wheel ok:', altiplano.__version__)"

      - name: Publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish \
            "dist/altiplano-${PKG_VERSION}.tar.gz" \
            "dist/altiplano-${PKG_VERSION}-py3-none-any.whl"

      # Only reached when the publish above succeeded, since a failing step ends
      # the job. A release therefore exists only for a version that reached PyPI.
      #
      # continue-on-error because the package has already shipped by the time this
      # runs. Failing to write the release is bookkeeping, and a red run would say
      # the publish failed. The step reports itself in the log and the summary.
      #
      # Idempotent, so re-running against a version already released does nothing.
      # It also cannot revise the notes on a release that exists: edit those on
      # GitHub, or delete the release and re-run.
      - name: Release
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$PKG_VERSION" > /dev/null 2>&1; then
            echo "$PKG_VERSION is already released, nothing to do."
            exit 0
          fi

          NOTES="${RUNNER_TEMP}/release-notes.md"

          # The body is this version's change log section, which is written per
          # release and reads better than anything generated from commit subjects.
          # Found by heading, so a version that is no longer the top-most section
          # still resolves, and matched as an exact string so the brackets in
          # `## [1.2.3]` need no escaping. Blank lines at both ends are trimmed.
          awk -v ver="$PKG_VERSION" '
            $0 == "## [" ver "]" { found = 1; next }
            found && /^## / { exit }
            found { line[++n] = $0 }
            END {
              for (first = 1; first <= n && line[first] ~ /^[[:space:]]*$/; first++);
              for (last = n; last >= first && line[last] ~ /^[[:space:]]*$/; last--);
              for (i = first; i <= last; i++) print line[i]
            }
          ' CHANGELOG.md > "$NOTES"

          if [[ ! -s "$NOTES" ]]; then
            MSG="CHANGELOG.md has no '## [${PKG_VERSION}]' section, so the release"
            MSG="$MSG would have no notes. Add the section, then create the release"
            MSG="$MSG by hand."
            echo "::error::$MSG"
            exit 1
          fi

          RELEASE_URL="$(gh release create "$PKG_VERSION" \
            --target "$GITHUB_SHA" \
            --title "V${PKG_VERSION}" \
            --notes-file "$NOTES")"
          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"
          echo "Released $PKG_VERSION at ${GITHUB_SHA:0:7}: $RELEASE_URL"

      # `success()` skips this when an earlier step failed. A failed Release step
      # does not skip it: continue-on-error means that step cannot fail the job.
      - name: Summary
        if: success()
        run: |
          {
            echo "### Published altiplano ${PKG_VERSION}"
            echo ""
            echo "- Commit: \`${GITHUB_SHA:0:7}\`"
            echo "- PyPI: https://pypi.org/project/altiplano/${PKG_VERSION}/"
            if [[ "${{ steps.release.outcome }}" == "failure" ]]; then
              echo ""
              echo "The GitHub release was **not** created. The publish itself"
              echo "succeeded, so ${PKG_VERSION} is on PyPI and must not be"
              echo "rebuilt. See the Release step for why, then create the"
              echo "release by hand."
            elif [[ -n "${RELEASE_URL:-}" ]]; then
              echo "- Release: ${RELEASE_URL}"
            else
              echo "- Release: ${PKG_VERSION} was already released, so nothing was created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
