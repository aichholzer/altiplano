[project]
name = "altiplano"
version = "1.3.0"
description = "Minimal MCP server for Vikunja (server-side filtering, no fluff)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Stefan Aichholzer", email = "theaichholzer@gmail.com" },
]
keywords = ["mcp", "vikunja", "model-context-protocol", "todo", "tasks"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  # Only the two versions CI actually runs. The ones in between will almost
  # certainly work; claiming them without testing them is a different thing.
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "mcp>=2.0.0,<3",
  "httpx>=0.27",
  # Serves the HTTP transport. Already in the tree through `mcp`, and declared
  # here because `http_server.py` imports it. Starlette stays undeclared: the
  # token gate is written against the ASGI interface and imports nothing from it.
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[tool.ruff]
# Matches the width the code is already written to. Ruff's linter does not
# enforce line length by default; this is here so `ruff format` would agree with
# the existing style and leave every file unreflowed.
line-length = 120

[tool.ruff.lint]
ignore = [
  # Flags the isinstance guard in `_items` for not raising TypeError. That guard
  # validates an API response. The rule assumes it is validating a caller's
  # argument. RuntimeError is the honest type here, and it is a documented part of
  # the contract the tests assert.
  "TRY004",
]

[tool.pytest.ini_options]
# The coverage gate lives here, out of the workflow. A local run and CI enforce
# the identical floor.
addopts = "--cov=altiplano --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  # The script entry guard cannot run under the test process.
  'if __name__ == "__main__":',
]

[project.urls]
Homepage = "https://github.com/aichholzer/altiplano"
Repository = "https://github.com/aichholzer/altiplano"
Issues = "https://github.com/aichholzer/altiplano/issues"

[project.scripts]
altiplano = "altiplano.server:main"
altiplano-http = "altiplano.http_server:main"
altiplano-clientkey = "altiplano.clientkey:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/altiplano"]
