[project]
name = "altiplano"
version = "0.8.6"
description = "Minimal MCP server for Vikunja (server-side filtering, no fluff)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Stefan Aichholzer", email = "theaichholzer@gmail.com" },
]
keywords = ["mcp", "vikunja", "model-context-protocol", "todo", "tasks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Utilities",
]
dependencies = [
  "mcp>=2.0.0,<3",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[tool.ruff]
# Matches the width the code is already written to. Ruff's linter does not
# enforce line length by default; this is here so `ruff format` would agree with
# the existing style rather than reflowing every file.
line-length = 120

[tool.ruff.lint]
ignore = [
  # Flags the isinstance guard in `_items` for not raising TypeError. That guard
  # validates an API response, not a caller's argument, so the rule's assumption
  # does not hold: RuntimeError is the honest type, and it is a documented part
  # of the contract the tests assert.
  "TRY004",
]

[tool.pytest.ini_options]
# The coverage gate lives here rather than in the workflow so a local run and CI
# enforce the identical floor.
addopts = "--cov=altiplano --cov-branch --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  # The script entry guard cannot run under the test process.
  'if __name__ == "__main__":',
]

[project.urls]
Homepage = "https://github.com/aichholzer/altiplano"
Repository = "https://github.com/aichholzer/altiplano"
Issues = "https://github.com/aichholzer/altiplano/issues"

[project.scripts]
altiplano = "altiplano.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/altiplano"]
